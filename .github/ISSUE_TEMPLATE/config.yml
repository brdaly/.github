blank_issues_enabled: false

contact_links:
  - name: Report a security vulnerability (not a public issue)
    url: https://github.com/brdaly/.github/blob/main/SECURITY.md
    about: >-
      Never report a vulnerability in a public issue. Use the affected
      repository's Security tab, then Advisories, then Report a
      vulnerability. This page explains what to include and what is out of
      scope.

  - name: Support and repository status
    url: https://github.com/brdaly/.github/blob/main/SUPPORT.md
    about: >-
      What support to expect for each status tier (Production, Candidate,
      Labs/Prototype, Research, Historical), and how to ask a question.

  - name: Contributing guide
    url: https://github.com/brdaly/.github/blob/main/CONTRIBUTING.md
    about: >-
      Change rules, the checks a pull request must pass, and what a good
      pull request contains.
